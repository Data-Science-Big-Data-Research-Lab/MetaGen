name: CI

on:
  push:
    branches: [master, dev, budget, trigen]
  pull_request:
    branches: [master, dev, budget]

jobs:
  tests:
    name: tests (python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      # Report every interpreter, do not cancel the matrix on the first red one.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install the package and the test tooling
        # The optional extras (ray, tensorflow) are deliberately left out: the
        # suite must collect and pass without them, which is what P-04 fixed, and
        # the one module that needs them, test/metaheuristics/test_extras.py,
        # skips cleanly.
        run: |
          python -m pip install --upgrade pip
          # The test extra, rather than naming the tools here: since P-08 the
          # suite's dependencies are declared in pyproject.toml, and this is what
          # keeps that declaration honest.
          pip install -e .[test]

      - name: Run the suite that must stay green
        # The whole tree since P-05: test/metaheuristics/test_behavior.py has to
        # run here.
        run: pytest test -q -rxX

  extras:
    name: tests with every extra
    runs-on: ubuntu-latest
    # The one job that installs the optional extras, all of them but TensorFlow, which no
    # extra declares. It runs the whole tree but the arithmetic bench, which needs no
    # extra and runs in the matrix above, so that a test that skips there runs here: Ray,
    # TensorBoard, NetCDF-4, the reports and the documentation pages that need them. It
    # used to run a list of files kept by hand, and the tests with Ray added to other
    # modules, and those of TensorBoard and NetCDF-4, ran nowhere.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package with the test extra and every optional one
        run: |
          python -m pip install --upgrade pip
          # networkx and pandas are not extras of the package: a figure of the reports
          # and an example of the documentation use them when they are there.
          pip install -e .[test,all] networkx pandas

      - name: Run every test that needs an extra
        shell: bash
        run: |
          pytest test --ignore=test/metaheuristics/test_behavior.py -q -rxXs | tee pytest.log
          # A test that skips here for want of a module runs nowhere: only TensorFlow may
          # be missing. A test may still skip for another reason, such as one that only
          # makes sense without Ray, which runs in the matrix above.
          if grep "^SKIPPED" pytest.log | grep -i -e "could not import" -e "needs " | grep -v -i tensorflow; then
            echo "These tests skipped for want of a module although every extra is installed."
            exit 1
          fi

  lint:
    name: ruff
    runs-on: ubuntu-latest
    # Only the pyflakes rules: unused imports and variables, undefined names. No style is
    # imposed. An import of a module that does not exist hid behind the type checker
    # until this ran.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Check the sources
        run: ruff check src --select F

  docs:
    name: documentation
    # Pinned: the archives of Ubuntu could not be reached from the first images of 26.04,
    # where ubuntu-latest moved in November 2026, and this is the one job that installs a
    # package from them. Read the Docs builds on 22.04.
    runs-on: ubuntu-24.04
    # What Read the Docs does, with warnings as errors: Python 3.11 and the requirements of
    # docs/ only, the package's own dependencies mocked by conf.py. A module that cannot be
    # imported under those mocks leaves its API reference empty while the build still
    # succeeds, which is how a constant computed with numpy at import time got as far as a
    # release candidate.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install what Read the Docs installs
        # Graphviz draws the inheritance diagrams of the API reference; the build image of
        # Read the Docs has it, the runner does not.
        # Every download retried: an archive of Ubuntu that stops answering for a few minutes
        # made the job fail while the documentation was fine.
        run: |
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=30 install -y --no-install-recommends graphviz
          python -m pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build the documentation
        run: sphinx-build -W --keep-going -b html docs/source docs/_build/html

  types:
    name: mypy
    runs-on: ubuntu-latest
    # Blocking since P-11 closed: mypy src is clean, on the 2.4.1 of the development
    # machine and on the latest release. A new error here is a regression.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the package and mypy
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install mypy

      - name: Type-check the sources
        run: mypy src
